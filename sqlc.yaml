version: "2"
sql:
  - engine: sqlite
    schema: internal/cache/schema.sql
    queries: internal/cache/queries.sql
    gen:
      go:
        package: cachedb
        out: internal/cache/cachedb
  - engine: sqlite
    schema: internal/state/migrations
    queries: internal/state/queries.sql
    gen:
      go:
        package: statedb
        out: internal/state/statedb
